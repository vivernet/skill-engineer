<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Skill Engineer</title>
  <desc id="desc">Violet hexagonal engineering emblem with a gear, AI circuit, blueprint, checklist, pencil, iteration arrows and golden sparkle.</desc>
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8B6FF"/><stop offset=".23" stop-color="#A86DFF"/><stop offset=".56" stop-color="#6D39F4"/><stop offset=".8" stop-color="#8B5CF6"/><stop offset="1" stop-color="#D3A3FF"/>
    </linearGradient>
    <linearGradient id="rimLight" x1=".12" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#FCF0FF" stop-opacity=".92"/><stop offset=".5" stop-color="#9F76FF" stop-opacity=".7"/><stop offset="1" stop-color="#6D41EE" stop-opacity=".85"/>
    </linearGradient>
    <radialGradient id="back" cx="49%" cy="40%" r="76%">
      <stop offset="0" stop-color="#251470"/><stop offset=".54" stop-color="#160B50"/><stop offset="1" stop-color="#100637"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#3B4EFF" stop-opacity=".35"/><stop offset="1" stop-color="#3920CB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" x2=".7" y1="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".34" stop-color="#D5DCFF"/><stop offset=".7" stop-color="#9CAEF2"/><stop offset="1" stop-color="#6973D9"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DFFF6"/><stop offset=".48" stop-color="#22D3EE"/><stop offset="1" stop-color="#277CF5"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#164FDB"/><stop offset=".55" stop-color="#0B36AD"/><stop offset="1" stop-color="#071C66"/>
    </linearGradient>
    <linearGradient id="paperRoll" x1="0" x2="1" y1="0" y2=".4">
      <stop offset="0" stop-color="#4E91F4"/><stop offset=".42" stop-color="#B8F0FF"/><stop offset=".8" stop-color="#56A7F8"/><stop offset="1" stop-color="#1C4EAF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFF7B5"/><stop offset=".35" stop-color="#FFE075"/><stop offset=".7" stop-color="#F5C84C"/><stop offset="1" stop-color="#FF9E35"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B42E4"/><stop offset=".32" stop-color="#A174FF"/><stop offset=".7" stop-color="#8260F4"/><stop offset="1" stop-color="#473BB9"/>
    </linearGradient>
    <pattern id="grid" width="21" height="21" patternUnits="userSpaceOnUse">
      <path d="M 21 0 H 0 V 21" stroke="#8ECCFF" stroke-opacity=".16" stroke-width=".8" fill="none"/>
    </pattern>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
      <feOffset in="b" dy="7" result="o"/>
      <feComponentTransfer in="o" result="a"><feFuncA type="linear" slope=".62"/></feComponentTransfer>
      <feMerge><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hexclip">
      <path d="M 256 44 Q 262 44 270 49 L 426 138 Q 440 146 440 161 L 440 351 Q 440 365 427 373 L 269 463 Q 256 471 243 463 L 85 373 Q 72 365 72 351 L 72 161 Q 72 146 86 138 L 242 49 Q 250 44 256 44 Z"/>
    </clipPath>
    <clipPath id="paperclip"><rect x="117" y="260" width="286" height="153" rx="18"/></clipPath>
  </defs>

  <!-- Standalone emblem; the area outside the polygon remains transparent. -->
  <path d="M 256 18 Q 266 18 280 26 L 448 123 Q 466 134 466 154 L 466 358 Q 466 378 448 389 L 280 486 Q 256 500 232 486 L 64 389 Q 46 378 46 358 L 46 154 Q 46 134 64 123 L 232 26 Q 246 18 256 18 Z" fill="url(#rim)" filter="url(#shadow)"/>
  <path d="M 256 32 Q 264 32 276 39 L 436 131 Q 452 140 452 158 L 452 354 Q 452 371 438 379 L 273 474 Q 256 484 239 474 L 74 379 Q 60 371 60 354 L 60 158 Q 60 140 76 131 L 236 39 Q 248 32 256 32 Z" fill="url(#rimLight)"/>
  <path d="M 256 44 Q 262 44 270 49 L 426 138 Q 440 146 440 161 L 440 351 Q 440 365 427 373 L 269 463 Q 256 471 243 463 L 85 373 Q 72 365 72 351 L 72 161 Q 72 146 86 138 L 242 49 Q 250 44 256 44 Z" fill="url(#back)" stroke="#2B1678" stroke-width="3"/>
  <g clip-path="url(#hexclip)">
    <ellipse cx="258" cy="270" rx="212" ry="204" fill="url(#halo)"/>
    <path d="M 103 348 Q 180 445 317 448" fill="none" stroke="#5033B2" stroke-width="13" opacity=".28"/>

    <!-- Two clear iteration arrows. -->
    <path d="M 112 256 C 115 177 172 122 221 119" fill="none" stroke="url(#cyan)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 213 102 L 250 119 L 216 144 Q 223 120 213 102 Z" fill="#62ECFF"/>
    <path d="M 308 432 C 376 422 414 369 415 323" fill="none" stroke="url(#cyan)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 397 337 L 417 305 L 437 339 Q 419 334 397 337 Z" fill="#55F0FB"/>

    <!-- Mechanical construction and neural circuit. -->
    <path d="M 232.54 130.01 L 238.89 128.59 L 241.11 112.02 L 270.89 112.02 L 273.11 128.59 L 279.46 130.01 L 280.68 130.33 L 286.89 132.28 L 297.10 119.04 L 322.88 133.93 L 316.52 149.39 L 321.31 153.79 L 322.21 154.69 L 326.61 159.48 L 342.07 153.12 L 356.96 178.90 L 343.72 189.11 L 345.67 195.32 L 345.99 196.54 L 347.41 202.89 L 363.98 205.11 L 363.98 234.89 L 347.41 237.11 L 345.99 243.46 L 345.67 244.68 L 343.72 250.89 L 356.96 261.10 L 342.07 286.88 L 326.61 280.52 L 322.21 285.31 L 321.31 286.21 L 316.52 290.61 L 322.88 306.07 L 297.10 320.96 L 286.89 307.72 L 280.68 309.67 L 279.46 309.99 L 273.11 311.41 L 270.89 327.98 L 241.11 327.98 L 238.89 311.41 L 232.54 309.99 L 231.32 309.67 L 225.11 307.72 L 214.90 320.96 L 189.12 306.07 L 195.48 290.61 L 190.69 286.21 L 189.79 285.31 L 185.39 280.52 L 169.93 286.88 L 155.04 261.10 L 168.28 250.89 L 166.33 244.68 L 166.01 243.46 L 164.59 237.11 L 148.02 234.89 L 148.02 205.11 L 164.59 202.89 L 166.01 196.54 L 166.33 195.32 L 168.28 189.11 L 155.04 178.90 L 169.93 153.12 L 185.39 159.48 L 189.79 154.69 L 190.69 153.79 L 195.48 149.39 L 189.12 133.93 L 214.90 119.04 L 225.11 132.28 L 231.32 130.33 Z" fill="url(#metal)" stroke="#EEF3FF" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="256" cy="220" r="76" fill="#112360" stroke="#6574DF" stroke-width="6"/>
    <circle cx="256" cy="220" r="65" fill="#0A225D" stroke="#233C98" stroke-width="2"/>
    <g fill="none" stroke="url(#cyan)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M 256 265 V 185"/>
      <path d="M 239 265 V 225 L 218 204 V 185"/>
      <path d="M 273 265 V 225 L 294 204 V 185"/>
      <path d="M 222 255 H 197 L 186 243"/>
      <path d="M 290 255 H 315 L 326 243"/>
    </g>
    <g fill="#3BEAFF" stroke="#A3FFF7" stroke-width="3">
      <circle cx="256" cy="181" r="10"/><circle cx="218" cy="181" r="10"/><circle cx="294" cy="181" r="10"/>
      <circle cx="184" cy="240" r="9"/><circle cx="328" cy="240" r="9"/>
    </g>

    <!-- Sparkle: visual quality/polish. -->
    <path d="M 365 115 Q 372 143 392 150 Q 371 155 365 183 Q 359 156 338 150 Q 359 144 365 115 Z" fill="url(#gold)" stroke="#FFF6C1" stroke-width="1.5" filter="url(#glow)"/>
    <path d="M 402 116 L 407 128 L 420 133 L 407 138 L 402 151 L 397 138 L 384 133 L 397 128 Z" fill="#FFE782"/>

    <!-- Architectural blueprint and checklists, rotated for depth. -->
    <g transform="rotate(-6 260 340)" filter="url(#shadow)">
      <rect x="117" y="260" width="286" height="153" rx="18" fill="url(#sheet)" stroke="#A7DDFF" stroke-width="5"/>
      <g clip-path="url(#paperclip)">
        <rect x="117" y="260" width="286" height="153" fill="url(#grid)"/>
        <path d="M 129 394 Q 274 428 403 378" fill="none" stroke="#78CBFF" stroke-opacity=".25" stroke-width="2"/>
        <g fill="none" stroke="#87E6FF" stroke-opacity=".55" stroke-dasharray="5 6" stroke-width="2">
          <rect x="171" y="294" width="142" height="100" rx="6"/>
        </g>
        <!-- Three nested, manufactured components. -->
        <path d="M 193 363 L 241 342 L 290 363 L 241 386 Z" fill="#23B7ED" stroke="#9CF5FF" stroke-width="3"/>
        <path d="M 193 344 L 241 323 L 290 344 L 241 366 Z" fill="#40CBFC" stroke="#C3FFFF" stroke-width="3"/>
        <path d="M 193 325 L 241 304 L 290 325 L 241 348 Z" fill="url(#metal)" stroke="#F8FFFF" stroke-width="3"/>
        <g stroke="#7DE6F8" stroke-width="3" fill="none">
          <rect x="324" y="292" width="16" height="16" rx="3"/>
          <rect x="324" y="326" width="16" height="16" rx="3"/>
          <rect x="324" y="360" width="16" height="16" rx="3"/>
          <path d="M 327 300 L 331 304 L 338 295 M 327 334 L 331 338 L 338 329 M 327 368 L 331 372 L 338 363" stroke-width="3.5"/>
          <path d="M 347 300 H 373 M 347 334 H 369 M 347 368 H 371" stroke-width="4" stroke-linecap="round"/>
        </g>
      </g>
      <!-- Rolled paper corner, unique engineering cue. -->
      <path d="M 125 269 C 110 256 93 269 93 291 L 93 390 C 96 411 117 417 137 399 C 125 405 119 395 119 384 V 288 C 118 278 121 272 125 269 Z" fill="url(#paperRoll)" stroke="#B7F1FF" stroke-width="3"/>
      <ellipse cx="118" cy="398" rx="21" ry="12" fill="#123C9B" stroke="#A1EDFF" stroke-width="3" transform="rotate(-10 118 398)"/>
    </g>

    <!-- Pencil forged from native vector shapes. -->
    <g transform="rotate(28 389 343)" filter="url(#shadow)">
      <rect x="378" y="269" width="27" height="110" rx="9" fill="url(#pencil)" stroke="#C7A9FF" stroke-width="2"/>
      <path d="M 380 283 H 403 V 305 H 380 Z" fill="#B37BFF" opacity=".72"/>
      <path d="M 378 317 H 405 V 334 H 378 Z" fill="url(#metal)"/>
      <path d="M 378 375 L 391.5 403 L 405 375 Z" fill="#FFE5B7" stroke="#FFF1D0" stroke-width="2"/>
      <path d="M 386 390 L 391.5 403 L 397 390 Z" fill="#172254"/>
      <rect x="380" y="264" width="23" height="18" rx="8" fill="#BB8AFB" stroke="#E7C0FF" stroke-width="1.5"/>
      <path d="M 386 339 V 365" stroke="#D8B7FF" stroke-opacity=".8" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Crisp inner contour remains readable at small sizes. -->
  <path d="M 256 44 Q 262 44 270 49 L 426 138 Q 440 146 440 161 L 440 351 Q 440 365 427 373 L 269 463 Q 256 471 243 463 L 85 373 Q 72 365 72 351 L 72 161 Q 72 146 86 138 L 242 49 Q 250 44 256 44 Z" fill="none" stroke="#B18AFF" stroke-opacity=".7" stroke-width="2"/>
</svg>
